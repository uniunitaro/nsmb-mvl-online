name: Bigstar Local

on:
  workflow_dispatch:

jobs:
  gui-check:
    name: GUI check for act
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install signaling dependencies for RPC types
        working-directory: tools/bigstar-signaling-server
        run: pnpm install --frozen-lockfile
      - name: Install GUI dependencies
        working-directory: tools/bigstar
        run: pnpm install --frozen-lockfile
      - name: Typecheck GUI
        working-directory: tools/bigstar
        run: pnpm typecheck
      - name: Build frontend
        working-directory: tools/bigstar
        run: pnpm vite:build
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Check ROM generator
        run: cargo check --manifest-path tools/bigstar-rom/Cargo.toml

  bridge-check:
    name: Bridge check for act
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Tango dependency
        run: |
          ref=283dacf2894d5e47be95a6d7f19acdda63a773b0
          if [ -d external/tango/.git ]; then
            git -C external/tango fetch --depth=1 origin "$ref"
          else
            git clone --no-checkout https://github.com/tangobattle/tango.git external/tango
            git -C external/tango fetch --depth=1 origin "$ref"
          fi
          git -C external/tango checkout --detach "$ref"
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install bridge build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config clang libclang-dev
      - name: Check bridge with WebRTC feature
        run: cargo check --features webrtc --manifest-path tools/bigstar-net-bridge/Cargo.toml
      - name: Run bridge signaling UDP pair smoke
        run: cargo run --features webrtc --manifest-path tools/bigstar-net-bridge/Cargo.toml -- webrtc-signaling-udp-pair-smoke
