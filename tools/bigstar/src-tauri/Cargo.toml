[package]
name = "bigstar"
version = "0.11.5"
description = "Bigstar online launcher"
edition = "2021"

[features]
default = []
insiders-edition = []
single-instance = ["dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
anyhow = "1"
flate2 = "1"
bigstar-rom = { path = "../../bigstar-rom" }
rfd = "0.15"
refinery = { version = "0.9.2", features = ["rusqlite"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri = { version = "2.9.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = "=2.4.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript", "derive"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
tauri-winrt-notification = "0.7.2"
win32job = "2.0.3"

[patch.crates-io]
tauri-plugin-window-state = { path = "vendor/tauri-plugin-window-state" }

[profile.dev.package.bigstar-rom]
opt-level = 3

[profile.dev.package.ds-rom]
opt-level = 3
